name: Pradera Print Header QA
on:
  push:
    branches: [pradera/print-header-line-cleanup-20261107]
  workflow_dispatch:
jobs:
  print-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF render tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq poppler-utils
      - name: Verify first PDF page and header line
        run: |
          python3 -m http.server 8741 --directory . >/tmp/pradera-server.log 2>&1 &
          sleep 2
          node tests/pradera-print-header-qa.mjs
      - name: Upload preview and test PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pradera-print-header-qa
          path: qa-results/
          if-no-files-found: ignore
