name: Pradera visual and interaction QA
on:
  push:
    branches: [pradera/surround-spacing-notes-20261019, pradera/notes-writing-area-20261019, pradera/remove-duplicate-prepared-by-20261019]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium testing
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run viewport and interaction QA
        run: |
          python3 -m http.server 8741 --directory . >/tmp/pradera-server.log 2>&1 &
          sleep 2
          node tests/pradera-audit.mjs
      - name: Collect images and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pradera-qa-results
          path: qa-results/
          if-no-files-found: ignore
